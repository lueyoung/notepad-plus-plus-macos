name: macOS build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure app and tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNPP_BUILD_TESTS=ON

      - name: Build app and XCTest bundle
        run: cmake --build build --target NotepadPlusPlusMac NppEncodingTests --parallel 3

      - name: Run XCTest
        env:
          CFFIXED_USER_HOME: ${{ runner.temp }}/np-tests-${{ matrix.arch }}
        run: |
          mkdir -p "$CFFIXED_USER_HOME"
          xcrun xctest build/NppEncodingTests.xctest

      - name: Verify and package Universal app
        run: |
          lipo -archs 'build/NP++.app/Contents/MacOS/NP++'
          codesign --verify --deep --strict 'build/NP++.app'
          ditto -c -k --sequesterRsrc --keepParent 'build/NP++.app' 'build/NP++-macOS-universal.zip'

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: NP++-macOS-universal-${{ matrix.arch }}-tested
          path: build/NP++-macOS-universal.zip
          if-no-files-found: error
